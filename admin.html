<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Device Info</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef5ff;font:15px Arial;padding:20px}
main{max-width:900px;margin:30px auto}section,.item{background:#1d2b40;border:1px solid #354966;border-radius:14px;padding:18px;margin:12px 0}
input{padding:12px;border-radius:8px;border:1px solid #50647e;background:#101c2d;color:white;margin:5px;width:min(100%,260px)}
button{padding:12px 18px;border:0;border-radius:8px;background:#25c6a5;font-weight:bold;margin:5px;cursor:pointer}
.muted{color:#a9bad0}.item{overflow-wrap:anywhere}.row{display:flex;flex-wrap:wrap;gap:8px}
</style></head><body><main>
<h1>Device Info Admin</h1><p class="muted">Only visitor submissions made after explicit consent appear here.</p>
<section id="login"><h3>Admin sign in</h3><input id="user" autocomplete="username" placeholder="Username"><input id="pass" type="password" autocomplete="current-password" placeholder="Password"><button id="signin">Sign in</button><div id="loginmsg" class="muted"></div></section>
<section id="panel" hidden><div class="row"><button id="refresh">Refresh</button><button id="logout">Log out</button></div><div id="records"></div></section>
</main><script>
let auth='';
const $=s=>document.querySelector(s);
function headers(){return {'Authorization':'Basic '+auth,'Content-Type':'application/json'}}
$('#signin').onclick=async()=>{
 auth=btoa(unescape(encodeURIComponent($('#user').value+':'+$('#pass').value)));
 await load();
};
async function load(){
 $('#loginmsg').textContent='Checking…';
 try{
  const r=await fetch('/.netlify/functions/admin-visitors',{headers:headers()});
  if(!r.ok) throw new Error('Invalid login or server error');
  const data=await r.json();
  $('#login').hidden=true;$('#panel').hidden=false;$('#loginmsg').textContent='';
  $('#records').innerHTML=data.items.length?data.items.map(x=>`<article class="item"><b>${esc(x.model||'Unavailable')}</b><p class="muted">${esc(x.sharedAt||'')}</p><div>Platform: ${esc(x.platform||'')}</div><div>Browser: ${esc(x.browser||'')}</div><div>Language: ${esc(x.language||'')}</div><div>Screen: ${esc(x.screen||'')}</div><div>Timezone: ${esc(x.timezone||'')}</div></article>`).join(''):'<p class="muted">No consented submissions yet.</p>';
 }catch(e){$('#loginmsg').textContent='Login failed. Check username/password.'}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#refresh').onclick=load;
$('#logout').onclick=()=>{auth='';$('#panel').hidden=true;$('#login').hidden=false;$('#pass').value='';};
</script></body></html>
